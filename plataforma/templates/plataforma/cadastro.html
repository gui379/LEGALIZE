<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Legalize - Cadastro</title>
    <style>
        body { margin:0; padding:0; background: linear-gradient(135deg, #510408 0%, #1e0103 100%); font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card-container { width: 750px; height: 520px; background-color: #92000a; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); display: flex; overflow: hidden; }
        .left-side { width: 45%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #92000a; }
        .logo-img { max-width: 140px; height: auto; }
        .right-side { width: 55%; background-color: #440106; display: flex; flex-direction: column; justify-content: center; padding: 30px; box-sizing: border-box; }
        .login-header { display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .login-header span { margin-right: 8px; font-size: 20px; color: #b07d35; }
        .form-group { width: 100%; margin-bottom: 12px; }
        input { width: 100%; padding: 10px; background-color: #210103; border: none; border-radius: 5px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input::placeholder { color: #756263; }
        .btn-entrar { width: 100%; padding: 12px; background-color: #aa722b; border: none; border-radius: 5px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-entrar:hover { background-color: #925c1f; }
        .links-footer { margin-top: 15px; text-align: center; }
        .links-footer a { color: white; text-decoration: none; font-size: 13px; font-weight: 500; }
        .alert-error { width: 100%; padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 5px; margin-bottom: 12px; font-size: 13px; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="left-side">
            <img src="{% static 'imagens/logo.jpg' %}" class="logo-img" alt="Logo" />
        </div>
        <div class="right-side">
            <div class="login-header">
                <span>👤</span> Cadastro
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-error">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" style="width: 100%;">
                {% csrf_token %}
                <div class="form-group"><input type="text" name="nome" placeholder="Nome completo" required /></div>
                <div class="form-group"><input type="email" name="email" placeholder="Endereço de E-mail" required /></div>
                <div class="form-group"><input type="text" name="usuario" placeholder="Nome de Usuário" required /></div>
                <div class="form-group"><input type="password" name="senha" placeholder="Senha" required /></div>
                <div class="form-group"><input type="password" name="confirmar_senha" placeholder="Confirme a Senha" required /></div>

                <button type="submit" class="btn-entrar">Cadastrar</button>
            </form>
            <div class="links-footer">
                <a href="{% url 'login' %}">Já tem conta? Faça login</a>
            </div>
        </div>
    </div>
</body>
</html>
